<!DOCTYPE html>
<HTML lang="en">
    <HEAD>

	<meta charset="UTF-8" />

    </HEAD>
    <BODY>
	{% if instructors %}
	    <!--H1>Student: {{ student.name }}</H1-->

	{% endif %}
    </BODY>
</HTML>
