<!DOCTYPE html>
<HTML lang="en">
    <HEAD>
        <TITLE>MASTER JJ</TITLE>
    </HEAD>
    <BODY>
	{% if student %}
	    <H1>Student: {{ student.name }}</H1>
	    <H3>Instructors:</H3>
	    <UL>
		{% for instructor in instructors %}
		    <LI>{{ instructor.id }}<B>{{ instructor.name }}</B></LI>
		{% endfor %}
	    </UL>
	{% else %}
	    <H1>Not found!</H1>
	{% endif %}
    </BODY>
</HTML>
